<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dojo Karate - Shito-Ryu Kenwa Mabuni</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', sans-serif; background: #f5f5f5; }
.dojo-title { font-family: 'Cinzel Decorative', serif; }
.dojo-subtitle { font-family: 'Cinzel', serif; }
.landing-screen {
  background: #0a0a0a;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.landing-screen::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  background-position: center center;
  mask-image: radial-gradient(ellipse 60% 60% at center, black 20%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 60% 60% at center, black 20%, transparent 70%);
  z-index: 1;
}
.corner {
  position: absolute;
  width: 50px;
  height: 50px;
  border-color: rgba(212, 168, 67, 0.4);
  border-style: solid;
  z-index: 10;
}
.corner-tl { top: 30px; left: 30px; border-width: 1px 0 0 1px; }
.corner-tr { top: 30px; right: 30px; border-width: 1px 1px 0 0; }
.corner-bl { bottom: 30px; left: 30px; border-width: 0 0 1px 1px; }
.corner-br { bottom: 30px; right: 30px; border-width: 0 1px 1px 0; }
.logo-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 260px;
  height: 260px;
  margin: 0 auto 30px auto;
  z-index: 5;
}
.logo-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  height: 200px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220, 38, 38, 0.6) 0%, rgba(220, 38, 38, 0.3) 40%, rgba(220, 38, 38, 0.1) 60%, transparent 75%);
  animation: glowPulse 3s ease-in-out infinite;
  z-index: 1;
  filter: blur(8px);
}
.logo-glow-outer {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 280px;
  height: 280px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220, 38, 38, 0.2) 0%, rgba(220, 38, 38, 0.08) 50%, transparent 70%);
  animation: glowPulseOuter 4s ease-in-out infinite;
  z-index: 0;
  filter: blur(15px);
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
@keyframes glowPulseOuter {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
}
.logo-img {
  width: 200px;
  height: 200px;
  object-fit: contain;
  position: relative;
  z-index: 3;
  animation: logoAppear 2s ease-out forwards;
  filter: drop-shadow(0 0 20px rgba(220, 38, 38, 0.5));
}
@keyframes logoAppear {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.particles-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 0%, #fbbf24 30%, #f59e0b 70%, #dc2626 100%);
  box-shadow: 0 0 10px #f59e0b, 0 0 20px #dc2626;
  animation: floatUp linear forwards;
  opacity: 0;
  filter: blur(1.5px);
}
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(0) translateX(0) scale(0.5); }
  20% { opacity: 1; }
  80% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-110vh) translateX(var(--drift)) scale(1.5); }
}
.top-text {
  color: rgba(212, 168, 67, 0.7);
  letter-spacing: 0.4em;
  font-size: 0.75rem;
  text-align: center;
  margin-bottom: 20px;
  text-transform: uppercase;
  z-index: 5;
  position: relative;
}
.title-shito {
  color: #ffffff;
  text-shadow: 0 0 20px rgba(255,255,255,0.3);
  letter-spacing: 0.2em;
  text-align: center;
  font-size: 2.2rem;
  margin: 5px 0;
  z-index: 5;
  position: relative;
  font-weight: 700;
}
.title-kenwa {
  color: #dc2626;
  text-shadow: 0 0 30px rgba(220, 38, 38, 0.6), 0 0 60px rgba(220, 38, 38, 0.3);
  letter-spacing: 0.15em;
  text-align: center;
  font-size: 2.5rem;
  margin: 0 0 15px 0;
  z-index: 5;
  position: relative;
  font-weight: 900;
}
.subtitle-text {
  color: rgba(200, 200, 200, 0.5);
  letter-spacing: 0.5em;
  font-size: 0.7rem;
  text-align: center;
  margin-bottom: 40px;
  text-transform: uppercase;
  z-index: 5;
  position: relative;
}
.btn-enter {
  background: linear-gradient(135deg, rgba(139, 0, 0, 0.3) 0%, rgba(80, 0, 0, 0.2) 100%);
  border: 1px solid rgba(212, 168, 67, 0.5);
  color: #f5f5f5;
  padding: 18px 60px;
  font-size: 0.95rem;
  letter-spacing: 0.3em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.4s ease;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 0 auto;
  border-radius: 2px;
  z-index: 5;
  position: relative;
  font-family: 'Cinzel', serif;
  text-decoration: none;
}
.btn-enter:hover {
  background: linear-gradient(135deg, rgba(180, 0, 0, 0.4) 0%, rgba(100, 0, 0, 0.3) 100%);
  border-color: rgba(212, 168, 67, 0.8);
  box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), inset 0 0 20px rgba(220, 38, 38, 0.1);
  transform: translateY(-2px);
}
.btn-enter .arrow { font-size: 1.2rem; transition: transform 0.3s ease; }
.btn-enter:hover .arrow { transform: translateX(5px); }
.gestion-text {
  color: rgba(150, 150, 150, 0.4);
  letter-spacing: 0.3em;
  font-size: 0.65rem;
  text-align: center;
  margin-top: 30px;
  text-transform: uppercase;
  z-index: 5;
  position: relative;
}
/* === MODAL LOGIN === */
.modal-login {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-login.active { display: flex; }
.login-box {
  background: linear-gradient(135deg, #1a0000 0%, #0a0a0a 100%);
  border: 1px solid rgba(212, 168, 67, 0.5);
  padding: 40px 35px;
  width: 90%; max-width: 380px;
  border-radius: 4px;
  box-shadow: 0 0 40px rgba(220, 38, 38, 0.3);
}
.login-title {
  color: #d4a843;
  text-align: center;
  letter-spacing: 0.3em;
  font-size: 1rem;
  margin-bottom: 25px;
}
.login-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(212, 168, 67, 0.3);
  color: #f5f5f5;
  padding: 12px 15px;
  margin-bottom: 15px;
  font-family: 'Roboto', sans-serif;
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  border-radius: 2px;
  outline: none;
}
.login-input:focus { border-color: rgba(212, 168, 67, 0.8); }
.login-msg {
  color: #dc2626;
  font-size: 0.8rem;
  text-align: center;
  min-height: 18px;
  margin-bottom: 10px;
  letter-spacing: 0.1em;
}
.login-buttons { display: flex; gap: 10px; margin-top: 10px; }
.btn-login {
  flex: 1;
  padding: 12px;
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  border-radius: 2px;
  text-transform: uppercase;
}
.btn-accept {
  background: linear-gradient(135deg, rgba(139,0,0,0.5), rgba(80,0,0,0.4));
  border: 1px solid rgba(212, 168, 67, 0.6);
  color: #f5f5f5;
}
.btn-accept:hover { background: linear-gradient(135deg, rgba(180,0,0,0.6), rgba(100,0,0,0.5)); }
.btn-cancel {
  background: transparent;
  border: 1px solid rgba(150,150,150,0.3);
  color: #aaa;
}
.btn-cancel:hover { border-color: rgba(150,150,150,0.6); color: #fff; }

@media (max-width: 640px) {
  .title-shito { font-size: 1.8rem; }
  .title-kenwa { font-size: 2rem; }
  .btn-enter { padding: 16px 40px; font-size: 0.85rem; letter-spacing: 0.2em; }
}
</style>
</head>
<body>
<div class="landing-screen">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="particles-container" id="particlesContainer"></div>
  <div class="text-center px-4" style="width: 100%; max-width: 500px; z-index: 5; position: relative;">
    <p class="dojo-subtitle top-text">ASOCIACIÓN DE KARATE</p>
    <div class="logo-wrapper">
      <div class="logo-glow-outer"></div>
      <div class="logo-glow"></div>
      <img src="logo.png" alt="Logo Dojo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <svg width="200" height="200" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" style="display:none;" class="logo-img">
        <circle cx="110" cy="110" r="108" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
        <circle cx="110" cy="110" r="100" fill="white" stroke="#B91C1C" stroke-width="3"/>
        <circle cx="110" cy="110" r="92" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2"/>
        <circle cx="110" cy="110" r="75" fill="white" stroke="#B91C1C" stroke-width="2"/>
        <rect x="100" y="35" width="20" height="150" fill="#B91C1C"/>
        <rect x="35" y="100" width="150" height="20" fill="#B91C1C"/>
        <circle cx="110" cy="110" r="30" fill="white" stroke="#B91C1C" stroke-width="1.5"/>
        <text x="110" y="95" text-anchor="middle" fill="#1a1a1a" font-size="18" font-family="serif" font-weight="bold">空</text>
        <text x="110" y="113" text-anchor="middle" fill="#1a1a1a" font-size="18" font-family="serif" font-weight="bold">手</text>
        <text x="110" y="131" text-anchor="middle" fill="#1a1a1a" font-size="18" font-family="serif" font-weight="bold">道</text>
        <path id="topTextPath" d="M 110, 110 m -85, 0 a 85,85 0 1,1 170,0" fill="none"/>
        <text fill="#1a1a1a" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1.5">
          <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">INTERNATIONAL KARATE DO - SHITO-RYU KENWAMABUNI -</textPath>
        </text>
        <path id="bottomTextPath" d="M 110, 110 m 85, 0 a 85,85 0 1,1 -170,0" fill="none"/>
        <text fill="#1a1a1a" font-size="8.5" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1.5">
          <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">VENEZUELA ASSOCIATION - SINCE 1984</textPath>
        </text>
      </svg>
    </div>
    <h1 class="dojo-title title-shito">SHITO-RYU</h1>
    <h2 class="dojo-title title-kenwa">KENWAMABUNI</h2>
    <p class="subtitle-text dojo-subtitle">DISCIPLINA · HONOR · ESFUERZO</p>
    <a href="#" onclick="abrirLogin(); return false;" class="btn-enter"><span>ENTRAR AL SISTEMA</span><span class="arrow">→</span></a>
    <p class="gestion-text dojo-subtitle">GESTIÓN INTERNA DEL DOJO</p>
  </div>

  <!-- MODAL LOGIN -->
  <div id="modalLogin" class="modal-login">
    <div class="login-box">
      <h3 class="dojo-subtitle login-title">ACCESO AL SISTEMA</h3>
      <input type="text" id="inpUser" class="login-input" placeholder="Usuario" autocomplete="off">
      <input type="password" id="inpPass" class="login-input" placeholder="Contraseña">
      <div id="loginMsg" class="login-msg"></div>
      <div class="login-buttons">
        <button class="btn-login btn-accept" onclick="validarLogin()">INGRESAR</button>
        <button class="btn-login btn-cancel" onclick="cerrarLogin()">CANCELAR</button>
      </div>
    </div>
  </div>
</div>

<script>
function createParticle() {
  const container = document.getElementById('particlesContainer');
  if (!container) return;
  const particle = document.createElement('div');
  particle.className = 'particle';
  const centerX = window.innerWidth / 2;
  const spread = window.innerWidth * 0.4;
  const startX = centerX + (Math.random() - 0.5) * spread;
  const size = Math.random() * 8 + 4;
  particle.style.width = size + 'px';
  particle.style.height = size + 'px';
  particle.style.left = startX + 'px';
  const drift = (Math.random() - 0.5) * 150;
  particle.style.setProperty('--drift', drift + 'px');
  const duration = Math.random() * 3 + 2;
  particle.style.animationDuration = duration + 's';
  particle.style.animationDelay = (Math.random() * 0.5) + 's';
  container.appendChild(particle);
  setTimeout(() => { if (particle.parentNode) particle.parentNode.removeChild(particle); }, (duration + 1) * 1000);
}
let particleInterval;
function startParticles() {
  for(let i=0; i<10; i++) setTimeout(createParticle, i*100);
  particleInterval = setInterval(createParticle, 150);
}
function stopParticles() { clearInterval(particleInterval); }
window.addEventListener('load', startParticles);

/* === LOGIN === */
function abrirLogin() {
  document.getElementById('modalLogin').classList.add('active');
  setTimeout(() => document.getElementById('inpUser').focus(), 50);
}
function cerrarLogin() {
  document.getElementById('modalLogin').classList.remove('active');
  document.getElementById('inpUser').value = '';
  document.getElementById('inpPass').value = '';
  document.getElementById('loginMsg').textContent = '';
}
function validarLogin() {
  const u = document.getElementById('inpUser').value.trim();
  const p = document.getElementById('inpPass').value.trim();
  const msg = document.getElementById('loginMsg');
  const usuarios = {
    'adm':      { pass: 'dojo2024', rol: 'admin'    },
    'invitado': { pass: 'sempai',   rol: 'invitado' }
  };
  if (usuarios[u] && usuarios[u].pass === p) {
    localStorage.setItem('usuario', u);
    localStorage.setItem('rol', usuarios[u].rol);
    window.location.href = 'sistema.html';
  } else {
    msg.textContent = '⚠ USUARIO O CONTRASEÑA INCORRECTOS';
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('modalLogin').classList.contains('active')) {
    validarLogin();
  }
  if (e.key === 'Escape') cerrarLogin();
});
</script>
</body>
</html>
